<html lang="ru">

          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

<body>
<div class="container">
    <div class="container__cards">
        <div class="card" data-payment-system="visa">
            <img src="" alt="Visa">
        </div>
        <div class="card" data-payment-system="mastercard">
            <img src="" alt="MasterCard">
        </div>
        <div class="card" data-payment-system="mir">

        </div>
    </div>
    <form class="form">
        <label for="card-number">Номер карты</label>
        <input id="card-number" name="cardNumber" type="text" inputmode="numeric">
        <button type="submit">Проверить</button>
    </form>
    <div class="result"></div>
